name: medipos
description: MediPoss - Medical Store POS with Dual Warehouse & Real-time Sync
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  objectbox: ^4.0.1
  objectbox_flutter_libs: any

  # State Management
  provider: ^6.1.2

  # Local HTTP Server (Windows Hub)
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.1

  # Networking (Android Sync Client)
  http: ^1.2.1

  # JWT Auth
  dart_jsonwebtoken: ^2.12.2

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.14.2

  # Barcode Scanner (Android)
  mobile_scanner: ^6.0.2

  # Icons
  lucide_icons: ^0.257.0

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  file_picker: ^10.3.10
  ntp: ^2.0.0
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  network_info_plus: ^6.0.0
  image_picker: ^1.2.1
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  objectbox_generator: any
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default:21
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256 # min:48, max:256, default:256

flutter:
  uses-material-design: true
  assets:
    - assets/images/
