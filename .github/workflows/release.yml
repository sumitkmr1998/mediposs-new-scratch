name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Dart sources
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run domain and service tests
        run: flutter test --no-pub test/domain test/services test/utils

      - name: Prepare Android release signing
        shell: pwsh
        env:
          MEDIPOSS_KEYSTORE_BASE64: ${{ secrets.MEDIPOSS_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MEDIPOSS_KEYSTORE_BASE64)) {
            throw 'MEDIPOSS_KEYSTORE_BASE64 is required to publish a release.'
          }
          [System.IO.File]::WriteAllBytes(
            "$env:GITHUB_WORKSPACE/android/app/release-key.jks",
            [Convert]::FromBase64String($env:MEDIPOSS_KEYSTORE_BASE64)
          )

      - name: Determine Version
        id: prep
        shell: bash
        run: |
          VERSION=$(grep 'version: ' pubspec.yaml | head -n 1 | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version determined: $VERSION"

      - name: Build Universal Android APK (Not Split)
        run: flutter build apk --release
        env:
          MEDIPOSS_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-key.jks
          MEDIPOSS_KEYSTORE_PASSWORD: ${{ secrets.MEDIPOSS_KEYSTORE_PASSWORD }}
          MEDIPOSS_KEY_ALIAS: ${{ secrets.MEDIPOSS_KEY_ALIAS }}
          MEDIPOSS_KEY_PASSWORD: ${{ secrets.MEDIPOSS_KEY_PASSWORD }}

      - name: Build Windows App
        run: flutter build windows --release

      - name: Package Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/mediposs-windows-v${{ steps.prep.outputs.version }}.zip

      - name: Prepare APK Asset
        shell: pwsh
        run: |
          Copy-Item -Path build/app/outputs/flutter-apk/app-release.apk -Destination build/mediposs-universal-v${{ steps.prep.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MediPoss v${{ steps.prep.outputs.version }}"
          draft: true
          prerelease: false
          files: |
            build/mediposs-windows-v${{ steps.prep.outputs.version }}.zip
            build/mediposs-universal-v${{ steps.prep.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
