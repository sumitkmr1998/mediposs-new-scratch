<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediPoss Cloud Web - POS, OPD & Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pin Login Modal Overlay -->
  <div class="login-screen" id="loginOverlay" style="display: none;">
    <div class="login-card" id="loginContainer">
      <!-- Injected by app.js -->
    </div>
  </div>

  <!-- App Shell Layout -->
  <div id="app">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M2 12h20"/></svg>
        </div>
        <div class="logo-text">
          <div class="logo-title">MediPoss</div>
          <div class="logo-subtitle">Cloud Web Portal</div>
        </div>
      </div>

      <nav class="sidebar-menu">
        <div class="menu-category">Main Navigation</div>
        <div id="navItemsContainer">
          <!-- Injected by app.js -->
        </div>
      </nav>

      <div class="sidebar-footer" id="sidebarUserPill">
        <!-- Injected by app.js -->
      </div>
    </aside>

    <!-- Main Viewport -->
    <div class="main-viewport">
      <!-- Topbar Header -->
      <header class="topbar">
        <div class="page-title-box" id="topPageTitleBox">
          <h1>Dashboard</h1>
          <p>Real-time overview of clinic and store metrics</p>
        </div>

        <div class="topbar-actions">
          <button class="btn btn-outline btn-sm" onclick="openHubSyncModal()" title="Connect Live Hub">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
            Connect Hub
          </button>
          <div class="sync-status-indicator">
            <span class="sync-dot"></span>
            Cloud Web Ready
          </div>
        </div>
      </header>

      <!-- Dynamic Content Body -->
      <main class="content-body" id="pageContent">
        <!-- Injected by app.js -->
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="state.js"></script>
  <script src="app.js"></script>
</body>
</html>
